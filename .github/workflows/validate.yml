name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: |
          pip install pyyaml
          python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code plugin validation
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.331
          claude plugin validate .
          claude plugin validate ./plugins/scrumscribe
